spring:
  application:
    name: moneyflow-service

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/moneyflow
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations; Hibernate only validates it matches.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway database migrations (production/PostgreSQL)
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  # H2 Console (for development)
  h2:
    console:
      enabled: false

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  # No default: JWT_SECRET (Base64, >= 256-bit) MUST be provided or startup fails.
  secret: ${JWT_SECRET}
  expiration: 86400000 # access token: 24 hours in milliseconds
  refresh-expiration: 604800000 # refresh token: 7 days in milliseconds

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# MoneyFlow app settings
moneyflow:
  accounts:
    # When true, non-credit accounts (cash/bank/e-wallet) cannot be driven below zero.
    enforce-sufficient-balance: ${ENFORCE_SUFFICIENT_BALANCE:false}
  notifications:
    email:
      # Set to true and configure spring.mail.* (host/username/password) to enable the email channel.
      enabled: ${MAIL_ENABLED:false}
      from: ${MAIL_FROM:no-reply@moneyflow.local}

# Mail (only used when moneyflow.notifications.email.enabled=true)
spring.mail:
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true

# Logging
logging:
  level:
    com.moneyflow: DEBUG
    org.springframework.security: INFO
