spring:
  # Use H2 for development
  datasource:
    url: jdbc:h2:mem:moneyflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Dev uses H2 with Hibernate-managed schema; Flyway is disabled here.
  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

# Dev-only JWT secret (Base64). Production must supply JWT_SECRET via environment.
jwt:
  secret: bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb25UaGF0U2hvdWxkQmVBdExlYXN0MjU2Qml0c0xvbmdBbmRTZWN1cmU=

logging:
  level:
    com.moneyflow: DEBUG
    org.hibernate.SQL: DEBUG
